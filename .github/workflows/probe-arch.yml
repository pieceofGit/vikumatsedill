name: Probe architecture questions
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe-arch.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: CORS — can the browser call ESPN directly?
        run: |
          echo "== scoreboard =="
          curl -sI -H "Origin: https://pieceofgit.github.io" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard" \
            | grep -i "access-control\|^HTTP" || echo "  (no access-control headers)"
          echo "== summary =="
          curl -sI -H "Origin: https://pieceofgit.github.io" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/summary?event=1" \
            | grep -i "access-control\|^HTTP" || echo "  (no access-control headers)"
      - name: Season-wide event ids, and standings
        run: |
          node -e '
          ;(async () => {
            const u = "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?limit=1000&dates=20260701-20270701"
            const b = await (await fetch(u)).json()
            console.log("PL events for the season range:", b.events?.length ?? 0)
            const e = b.events?.[0]
            if (e) console.log("  sample:", e.id, e.date, e.name)
            const st = await (await fetch("https://site.api.espn.com/apis/v2/sports/soccer/eng.1/standings")).json()
            console.log("\nstandings keys:", Object.keys(st).join(", "))
            const entries = st.children?.[0]?.standings?.entries ?? st.standings?.entries ?? []
            console.log("entries:", entries.length)
            if (entries[0]) {
              console.log("  team:", entries[0].team?.displayName)
              console.log("  stats:", entries[0].stats.map(s => s.name).join(", "))
            }
          })()'
