name: Probe match detail depth
# Temporary: what does the free feed expose beyond scores? Grounds the
# question of how close a FotMob-style match page could actually get.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe-depth.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          node -e '
          ;(async () => {
            const sb = await (await fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard")).json()
            const ev = (sb.events ?? []).find(e => e.competitions?.[0]?.status?.type?.state !== "pre") ?? sb.events?.[0]
            if (!ev) return console.log("no event")
            console.log("event:", ev.name, "| state:", ev.competitions[0].status.type.state)
            const s = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/summary?event=${ev.id}`)).json()
            console.log("\nTOP-LEVEL KEYS:", Object.keys(s).join(", "))
            for (const k of Object.keys(s)) {
              const v = s[k]
              const n = Array.isArray(v) ? `array[${v.length}]` : typeof v === "object" && v ? `object{${Object.keys(v).slice(0,8).join(",")}}` : typeof v
              console.log(`  ${k}: ${n}`)
            }
            if (s.boxscore?.teams?.[0]) {
              console.log("\nTEAM STATS:", (s.boxscore.teams[0].statistics ?? []).map(x => x.name).join(", "))
            }
            if (s.boxscore?.players?.[0]) {
              const grp = s.boxscore.players[0]
              console.log("\nPLAYER STAT KEYS:", (grp.statistics?.[0]?.keys ?? []).join(", "))
              console.log("PLAYER SAMPLE:", JSON.stringify(grp.statistics?.[0]?.athletes?.[0]?.stats ?? null))
            }
            if (s.commentary) console.log("\nCOMMENTARY entries:", s.commentary.length, "| sample:", JSON.stringify(s.commentary.slice(-2)))
            if (s.rosters) console.log("\nROSTERS:", s.rosters.length, "| first XI count:", (s.rosters[0]?.roster ?? []).length)
            if (s.keyEvents) console.log("\nKEY EVENTS:", s.keyEvents.length)
            if (s.standings) console.log("\nSTANDINGS present:", Object.keys(s.standings).join(","))
          })()'
